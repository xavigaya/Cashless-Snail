# Comprova cada canvi: tipus de tots els paquets i proves contra PostgreSQL.
name: Proves

on:
  push:
    branches: [main]
  pull_request:

jobs:
  proves:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cashless
          POSTGRES_PASSWORD: cashless
          POSTGRES_DB: cashless_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cashless"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:shared
      - run: pnpm typecheck
      - run: pnpm --filter @cashless/shared test
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://cashless:cashless@localhost:5432/cashless_test
